name: snippets-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository contract
        run: python scripts/validate_repository.py

      - name: Compile standard-library snippets
        run: |
          python -m compileall -q codebase-anatomy/src codebase-anatomy/tests
          python -m compileall -q archive-bundler/src archive-bundler/tests

      - name: Test codebase anatomy
        run: python -m unittest discover -s codebase-anatomy/tests -p "test_*.py" -v

      - name: Test archive bundler
        run: python -m unittest discover -s archive-bundler/tests -p "test_*.py" -v

      - name: Install Qt runtime for screenshotter
        run: python -m pip install "PySide6>=6.8,<7"

      - name: Compile app screenshotter
        run: python -m compileall -q app-screenshotter/src app-screenshotter/tests

      - name: Test app screenshotter offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s app-screenshotter/tests -p "test_*.py" -v
